[package]
name = "smol-ddns"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hmac = "0.13.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
sha2 = "0.11.0"
simple-dns = "0.12.0"
futures-util = "0.3.34"
rtnetlink = "0.23.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"]}
anyhow = "1.0.104"
thiserror = "2.0.21"
